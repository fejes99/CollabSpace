# Spring test context
spring.main.allow-bean-definition-overriding=true

# Actuator
management.endpoint.health.show-components=always

# Security filter chain fixtures
INTERNAL_TOKEN=test-internal-token

# SnsWorkspaceEventPublisher requires this property to resolve. InviteMemberIntegrationTest
# does exercise a real publish() call (fail-open, so the test still passes) -- without
# AWS_SNS_ENDPOINT_OVERRIDE below, that call reaches real AWS using whatever credentials
# happen to be on the machine running the tests, which is exactly the "tests that hit real
# AWS" anti-pattern this project explicitly disallows. Pointing at a closed local port
# (matching security-filter.md's own localhost:1 trick for simulating Redis unavailability)
# makes the failure deterministic and network-free instead.
SNS_WORKSPACE_EVENTS_TOPIC_ARN=arn:aws:sns:eu-central-1:000000000000:workspace-events-test
AWS_SNS_ENDPOINT_OVERRIDE=http://localhost:1
