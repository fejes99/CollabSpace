[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Runtime and dev dependencies are declared here rather than in a separate
# requirements.txt. This diverges from the FastAPI documentation (which uses
# requirements.txt) in favour of current Python packaging best practice (PEP 621).
# The Dockerfile extracts runtime deps via tomllib (stdlib) to avoid pip install
# building the package during the layer-cached dependency step.
[project]
name = "ai-assistant"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "black>=24.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.black]
target-version = ["py314"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
