# docker-compose.yml — CollabSpace local development environment
#
# Default profile (make up / make down):
#   No infrastructure containers needed for the walking skeleton — services are
#   health-endpoint-only and have no database dependencies yet.
#   Uncomment postgres/mongo/redis/localstack when the services that use them
#   are implemented (Stage 2+).
#
# Services profile (make up-all / make down-all):
#   Builds and runs auth-workspace and document-service in Docker — useful for
#   Dockerfile verification, integration tests, or reproducing CI locally.
#   Application services are normally run natively (see docs/07-development/local-setup.md).

networks:
  collabspace:
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # auth-workspace — Spring Boot 4 / Java 25
  # Requires: nothing (walking skeleton — health endpoint only)
  # Add: postgres, redis depends_on when service implementation begins (Stage 2)
  # ---------------------------------------------------------------------------
  auth-workspace:
    profiles: ["services"]
    build:
      context: ./services/auth-workspace
      dockerfile: Dockerfile
    image: auth-workspace:local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: development
    networks:
      - collabspace
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # document-service — Node.js 24 / TypeScript / Fastify
  # Requires: nothing (walking skeleton — health endpoint only)
  # Add: mongo depends_on when service implementation begins (Stage 2)
  # ---------------------------------------------------------------------------
  document-service:
    profiles: ["services"]
    build:
      context: ./services/document-service
      dockerfile: Dockerfile
    image: document-service:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: "3000"
    networks:
      - collabspace
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # realtime-service — Node.js 24 / TypeScript / Fastify / ws
  # Requires: nothing (walking skeleton — health endpoint only)
  # Add: redis depends_on when service implementation begins (Stage 2)
  # ---------------------------------------------------------------------------
  realtime-service:
    profiles: ["services"]
    build:
      context: ./services/realtime-service
      dockerfile: Dockerfile
    image: realtime-service:local
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: "3001"
    networks:
      - collabspace
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

