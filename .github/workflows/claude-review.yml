# Claude PR Review
#
# Posts a single review comment on a PR when:
#   1. The PR is opened as non-draft or flipped from draft to ready, OR
#   2. An OWNER comment containing "@claude" is posted on an open PR.
#
# Skip conditions (handled by the `gate` step):
#   - Draft PR
#   - Fork PR
#   - PR title starts with "[fast]" (case-insensitive)
#   - Closed/merged PR for @claude trigger
#   - Bot-authored comment / self-loop from github-actions[bot]
#   - Comment author_association != OWNER
#   - Oversized PR (>100 changed files OR >5000 line changes) — posts a polite skip comment
#
# Cost caps:
#   - timeout-minutes: 10
#   - max_tokens: 12000 (output cap)
#
# See:
#   - docs/05-cicd/plans/claude-pr-review.md
#   - docs/06-decisions/adr-024-claude-pr-review.md

name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write  # required by anthropics/claude-code-action for OIDC token exchange

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: gate
        name: Decide whether to review
        uses: actions/github-script@v7
        with:
          script: |
            const evt = context.eventName;
            const payload = context.payload;
            let pr;

            const skip = (reason, opts = {}) => {
              core.info(`Skip: ${reason}`);
              core.setOutput('should-review', 'false');
              core.setOutput('reason', reason);
              if (opts.sizeSkip) {
                core.setOutput('size-skip', 'true');
                core.setOutput('changed-files', String(opts.changedFiles));
                core.setOutput('total-lines', String(opts.totalLines));
              }
            };

            if (evt === 'pull_request') {
              pr = payload.pull_request;
              if (pr.draft) return skip('Draft PR');
              if (pr.head.repo.fork) return skip('Fork PR');
            } else if (evt === 'issue_comment') {
              if (!payload.issue.pull_request) return skip('Not a PR comment');
              if (!payload.comment.body.includes('@claude')) return skip('No @claude mention');
              if (payload.comment.author_association !== 'OWNER') {
                return skip(`Commenter is ${payload.comment.author_association}, not OWNER`);
              }
              if (payload.comment.user.type === 'Bot') return skip('Bot author');
              if (payload.comment.user.login === 'github-actions[bot]') {
                return skip('Self-loop from github-actions[bot]');
              }
              if (payload.issue.state !== 'open') return skip(`PR is ${payload.issue.state}, not open`);

              const { data: prData } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: payload.issue.number,
              });
              if (prData.draft) return skip('Draft PR');
              if (prData.head.repo.fork) return skip('Fork PR');
              pr = prData;
            } else {
              return skip(`Unsupported event: ${evt}`);
            }

            if ((pr.title || '').toLowerCase().startsWith('[fast]')) {
              return skip('[fast] PR — review skipped');
            }

            const totalLines = (pr.additions ?? 0) + (pr.deletions ?? 0);
            const changedFiles = pr.changed_files ?? 0;
            if (changedFiles > 100 || totalLines > 5000) {
              return skip(
                `Oversized PR (${changedFiles} files, ${totalLines} lines)`,
                { sizeSkip: true, changedFiles, totalLines },
              );
            }

            core.info('Gate passed — review will run');
            core.setOutput('should-review', 'true');
            core.setOutput('reason', 'OK');
            core.setOutput('pr-number', String(pr.number));

      - name: Post oversized-PR skip comment
        if: steps.gate.outputs.size-skip == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            const changedFiles = '${{ steps.gate.outputs.changed-files }}';
            const totalLines = '${{ steps.gate.outputs.total-lines }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body:
                `Claude PR review skipped — diff exceeds the configured size limit ` +
                `(${changedFiles} files, ${totalLines} line changes; limit is 100 files / 5000 lines). ` +
                `Split the PR or run the review manually. See ` +
                `[ADR-024](../blob/main/docs/06-decisions/adr-024-claude-pr-review.md).`,
            });

      - name: Check out repo
        if: steps.gate.outputs.should-review == 'true'
        uses: actions/checkout@v4
        with:
          # actions/checkout defaults to github.sha, which for issue_comment
          # events is main's HEAD, not the PR's code. Force the PR's head
          # commit explicitly so Claude has an actual diff to review.
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}

      # SHA-pinned (GitHub Actions security best practice — see ADR-024).
      # Resolve a new SHA via: `git ls-remote https://github.com/anthropics/claude-code-action.git refs/tags/v1`
      # then take the line ending in `refs/tags/v1^{}`. Rotation cadence in ADR-024.
      #
      # Configuration nuance: model / max-turns go through `claude_args` (CLI flags),
      # not as top-level inputs. The action does not expose an output-token cap;
      # cost is bounded by `--max-turns` (agent loop) and `timeout-minutes` (wall clock).
      # See ADR-024 §Decision.
      - name: Run Claude code review
        if: steps.gate.outputs.should-review == 'true'
        uses: anthropics/claude-code-action@fc6b9d4a0a8400c5e066ae686de922d161ea935e  # (= current @v1, rotated 2026-07-02)
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # --allowedTools grants gh commands Claude needs to fetch the diff AND post the
          # review. .claude/settings.json's Bash(*) does NOT cover these — gh subcommands
          # require an explicit grant here regardless of the repo's own permissions.allow.
          # gh pr review is the actual posting mechanism: this action's "agent" mode (used
          # whenever a custom prompt is supplied) does NOT auto-post Claude's final text
          # anywhere — confirmed by reading the action's own post-run step, which only
          # checks for buffered inline comments and revokes the installation token.
          # --max-turns raised 15 -> 30: real usage (post permission fixes) showed a ~20-file
          # diff exhausts 15 turns just fetching the diff, before any review text is written.
          # See ADR-024 addendum.
          #
          # TEMPORARY: model swapped to haiku for one cheap validation run to confirm the
          # posting mechanism works before paying Sonnet prices again. Revert to
          # claude-sonnet-4-6 once confirmed.
          claude_args: --model claude-haiku-4-5 --max-turns 30 --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*)"
          show_full_output: true  # temporary — diagnosing permission_denials_count; see ADR-024. Remove once resolved.
          prompt: |
            You are a senior engineer reviewing pull request #${{ steps.gate.outputs.pr-number }}
            in ${{ github.repository }} on a learning project. The PR's code is already checked
            out in the working directory — do not look up or list other PRs.
            Fetch the full diff once with `gh pr diff <number>` (redirect it to a file if it's
            long) rather than re-running `gh pr diff` separately per file — you have a limited
            turn budget.
            Review the PR diff for: correctness, potential bugs, security issues (OWASP top 10),
            idiomatic usage per language, and production readiness concerns.
            Be direct and educational — this is a tutor relationship, not just a checklist.

            Once you've written the review, post it yourself with:
            gh pr review ${{ steps.gate.outputs.pr-number }} --comment --body "<review text>"
            Do not use the code-review skill or write the review to a file — only `gh pr review`
            actually posts it.
